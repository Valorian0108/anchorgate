<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:640px;height:160px;overflow:hidden;background:#FBF9F4}
  #lockup{
    width:640px;height:160px;background:#FBF9F4;
    display:flex;align-items:center;gap:28px;padding:0 48px;
    font-family:"Schibsted Grotesk",sans-serif;
  }
  #lockup svg{width:96px;height:96px;flex:none;color:#1C3A66}
  #lockup .word{font-weight:800;font-size:58px;letter-spacing:-0.02em;color:#1C1917}
</style>
</head>
<body>
  <div id="lockup" role="img" aria-label="AnchorGate lockup">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="17" r="6"/>
      <path d="M32 23 V53"/>
      <path d="M20 31 H44"/>
      <path d="M14 37 Q21 51 32 53 Q43 51 50 37"/>
      <path d="M14 37 l-4 8 l9 -3"/>
      <path d="M50 37 l4 8 l-9 -3"/>
    </svg>
    <span class="word">AnchorGate</span>
  </div>
</body>
</html>
