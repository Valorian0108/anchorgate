<!doctype html>
<!--
  AnchorGate · Live Instrument specimen · v2 (12 oct 2026)

  v2 exists because v1 passed the named-tell checklist but still *felt*
  AI-generated. The deeper tells were the safe defaults a model reaches for:
  the donut gauge, pill buttons, rounded cards, centred-even composition, timid
  type, and twin equal actions. v2 replaces them with ownable choices:

    - the ANCHOR WALL (horizontal budget bar + hard ink cap) instead of a donut
    - sharp geometry (small radius), not pills / soft cards
    - a left-aligned editorial composition with real hierarchy, not centred-even
    - a confident hero number; the serif voice used for the one ceremonial line
    - asymmetric actions: one solid primary, one quiet text secondary
    - print weight: heavier rules, an ink border on the item that needs you

  Still built to design-research/CONSTRAINTS.md §3 (bans 1-19) and §7 (motion).
  Interact: Approve / Decline, then Replay.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnchorGate · Live Instrument specimen · v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1917; --ink-soft:#57534E; --paper:#FBF9F4; --surface:#F3EFE7;
    --line:#E4DED3; --warm-dark:#201819;
    --seal-deep:#122947; --seal:#1C3A66; --seal-bright:#2A5AA0; --seal-tint:#E8EDF5;
    --allow:#2F6B4F; --allow-tint:#E6F1EC;
    --ask:#A66312;   --ask-tint:#F6EAD8;
    --deny:#9E2B25;  --deny-tint:#F6E4E2;
    --display:'Schibsted Grotesk',sans-serif;
    --serif:'Newsreader',serif;
    --mono:'IBM Plex Mono',monospace;
    --d-fast:120ms; --d-med:220ms; --d-slow:420ms;
    --ease-out:cubic-bezier(0.16,1,0.3,1);
    --ease-inout:cubic-bezier(0.65,0,0.35,1);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--display); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .spec{max-width:720px; margin:0 auto; padding:40px 28px 72px}

  /* masthead: a heavier print rule */
  .masthead{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding-bottom:18px; border-bottom:2px solid var(--ink);
  }
  .wordmark{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.14em; font-size:15px}
  .wordmark svg{color:var(--seal)}
  .engine-line{font-family:var(--mono); font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  /* the anchor wall: a live horizontal instrument, left-aligned */
  .budget{padding:44px 0 6px}
  .budget-row{display:flex; align-items:flex-end; justify-content:space-between; gap:20px}
  .spent{
    font-family:var(--mono); font-weight:500; font-variant-numeric:tabular-nums;
    font-size:clamp(2.8rem,9vw,3.8rem); line-height:.95; letter-spacing:-.02em;
  }
  .budget-meta{text-align:right; padding-bottom:7px}
  .of{font-family:var(--mono); font-size:13px; color:var(--ink-soft)}
  .of .cap{color:var(--ink); font-weight:500}
  .pct{font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-top:5px}

  .wall{position:relative; height:14px; margin-top:24px; background:var(--surface); border-radius:2px}
  .wall-fill{
    position:absolute; inset:0; background:var(--seal); border-radius:2px;
    transform-origin:left center; transform:scaleX(.21);
    transition:transform var(--d-slow) var(--ease-inout);
  }
  .wall-cap{position:absolute; top:-5px; bottom:-5px; right:0; width:2px; background:var(--ink)}
  .cap-note{
    margin:18px 0 0; font-family:var(--serif); font-size:16px; color:var(--ink);
    display:flex; align-items:center; gap:9px;
  }
  .cap-note svg{color:var(--ink-soft); flex:none}

  /* the gate */
  .gate{margin-top:48px}
  .gate-head{display:flex; align-items:baseline; justify-content:space-between; padding-bottom:12px; border-bottom:1px solid var(--line)}
  .gate-head h2{margin:0; font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink)}
  .gate-count{font-family:var(--mono); font-size:12px; color:var(--ink-soft)}
  .gate-list{display:flex; flex-direction:column; gap:16px; padding-top:18px}

  /* decision card: sharp, asymmetric, printed */
  .card{
    position:relative; background:var(--paper);
    border:1px solid var(--line); border-radius:6px; padding:20px;
    transition:transform var(--d-fast) var(--ease-out), box-shadow var(--d-fast) var(--ease-out);
  }
  .card:hover{transform:translateY(-1px); box-shadow:0 8px 22px rgba(28,25,23,.08)}
  .card.needs-you{border-color:var(--ink); box-shadow:0 6px 20px rgba(28,25,23,.10)}

  .card-main{display:flex; align-items:flex-start; justify-content:space-between; gap:20px}
  .status-mark{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink)}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--ask); flex:none}
  .dot.ok{background:var(--allow)}
  .dot.no{background:var(--deny)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
  .card.needs-you .dot{animation:pulse 1.6s var(--ease-inout) infinite}

  .seller{font-size:1.28rem; font-weight:700; letter-spacing:-.01em; margin-top:11px}
  .what{font-size:13px; color:var(--ink-soft); margin-top:3px}
  .why{font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-top:11px}
  .amount{
    font-family:var(--mono); font-weight:500; font-variant-numeric:tabular-nums;
    font-size:1.95rem; letter-spacing:-.01em; color:var(--seal); text-align:right; line-height:1;
  }
  .card.paid .amount,.card.denied .amount{color:var(--ink)}

  .card-actions{display:flex; align-items:center; gap:20px; margin-top:20px}
  .btn.primary{
    font-family:var(--display); font-size:14px; font-weight:700; color:var(--paper);
    background:var(--seal); border:none; border-radius:6px; padding:11px 28px; cursor:pointer;
    transition:transform var(--d-fast) var(--ease-out), background-color var(--d-fast) var(--ease-out);
  }
  .btn.primary:hover{background:var(--seal-bright)}
  .btn.primary:active{transform:translateY(1px)}
  .btn.quiet{
    font-family:var(--display); font-size:14px; font-weight:500; color:var(--ink-soft);
    background:none; border:none; padding:11px 2px; cursor:pointer;
    transition:color var(--d-fast) var(--ease-out);
  }
  .btn.quiet:hover{color:var(--ink); text-decoration:underline}

  .verdict{margin-top:18px; padding-top:16px; border-top:1px solid var(--line)}
  .stamp{
    display:inline-block; font-family:var(--serif); font-weight:600; font-size:15px;
    letter-spacing:.16em; text-transform:uppercase; padding:4px 12px; transform:rotate(-4deg);
  }
  @keyframes land{from{transform:rotate(-4deg) scale(1.18); opacity:0}to{transform:rotate(-4deg) scale(1); opacity:1}}
  .stamp{animation:land var(--d-med) var(--ease-out)}
  .stamp.allow{color:var(--allow); border:2px double var(--allow)}
  .stamp.deny{color:var(--deny); border:2px double var(--deny)}
  .receipt{font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-top:11px; line-height:1.7}

  @keyframes enter{from{transform:translateY(10px); opacity:0}to{transform:none; opacity:1}}
  .card.enter{animation:enter var(--d-med) var(--ease-out)}

  .spec-foot{
    margin-top:44px; padding-top:16px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-family:var(--mono); font-size:12px; color:var(--ink-soft);
  }
  .replay{
    font-family:var(--display); font-size:13px; font-weight:600; color:var(--seal);
    background:transparent; border:1px solid var(--line); border-radius:6px; padding:8px 16px; cursor:pointer;
    transition:border-color var(--d-fast) var(--ease-out), transform var(--d-fast) var(--ease-out);
  }
  .replay:hover{border-color:var(--seal)}
  .replay:active{transform:translateY(1px)}

  @media (prefers-reduced-motion: reduce){
    .card.needs-you .dot{animation:none}
    .stamp{animation:none}
    .card.enter{animation:none}
    .card,.btn,.replay{transition:none}
    .wall-fill{transition:none}
  }
</style>
</head>
<body>
<main class="spec">
  <header class="masthead">
    <div class="wordmark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="5" r="2.2"/><line x1="12" y1="7.2" x2="12" y2="20"/>
        <path d="M5 13c0 4 3.2 7 7 7s7-3 7-7"/><line x1="9" y1="10" x2="15" y2="10"/>
      </svg>
      ANCHORGATE
    </div>
    <div class="engine-line" id="engineLine">engine · rules owner-3 · checked fresh every time</div>
  </header>

  <section class="budget" aria-label="Monthly budget">
    <div class="budget-row">
      <div class="spent" id="spentNum">$42.00</div>
      <div class="budget-meta">
        <div class="of">of your <span class="cap">$200.00</span> monthly limit</div>
        <div class="pct" id="pct">21% used</div>
      </div>
    </div>
    <div class="wall" aria-hidden="true">
      <div class="wall-fill" id="wallFill"></div>
      <div class="wall-cap"></div>
    </div>
    <p class="cap-note">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="5" r="2.2"/><line x1="12" y1="7.2" x2="12" y2="20"/>
        <path d="M5 13c0 4 3.2 7 7 7s7-3 7-7"/><line x1="9" y1="10" x2="15" y2="10"/>
      </svg>
      Approval cannot move this line.
    </p>
  </section>

  <section class="gate" aria-label="Decisions waiting on you">
    <div class="gate-head">
      <h2>At the gate</h2>
      <span class="gate-count" id="gateCount">1 waiting</span>
    </div>
    <div class="gate-list" id="gateList"></div>
  </section>

  <footer class="spec-foot">
    <span>Living specimen v2 · feel the motion · not the product yet</span>
    <button class="replay" id="replay" type="button">Replay</button>
  </footer>
</main>

<script>
  const CAP = 200;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const wallFill = document.getElementById('wallFill');
  const spentNum = document.getElementById('spentNum');
  const pct = document.getElementById('pct');
  const engineLine = document.getElementById('engineLine');
  const gateList = document.getElementById('gateList');
  const gateCount = document.getElementById('gateCount');

  let spent = 42;
  const queue = [
    { seller:'Book Depository', what:'books · Gardening book', category:'books', amount:49.00, why:'first-time seller' },
    { seller:'Cloud Nine Hosting', what:'cloud_services · Monthly plan', category:'cloud_services', amount:29.00, why:'first-time seller' },
  ];
  let qi = 0;

  const fmt = n => '$' + n.toFixed(2);
  const now = () => { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
  const setEngine = s => { engineLine.textContent = s; };

  function wallColor(frac){
    if (frac >= 0.85) return 'var(--deny)';
    if (frac >= 0.6) return 'var(--ask)';
    return 'var(--seal)';
  }
  function setWall(frac){
    wallFill.style.transform = 'scaleX(' + Math.min(frac, 1) + ')';  // the bar stops at the cap, never past it
    wallFill.style.backgroundColor = wallColor(frac);
    pct.textContent = Math.round(frac * 100) + '% used';
  }
  function animateNumber(from, to){
    if (reduce){ spentNum.textContent = fmt(to); return; }
    const t0 = performance.now(), DUR = 420;
    (function frame(t){
      const p = Math.min(1, (t - t0) / DUR);
      const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2;
      spentNum.textContent = fmt(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(frame);
    })(t0);
    setTimeout(() => { spentNum.textContent = fmt(to); }, DUR + 80);
  }

  function updateCount(){
    const n = gateList.querySelectorAll('.card.needs-you').length;
    gateCount.textContent = n === 0 ? 'all clear' : n + ' waiting';
  }
  function stampHTML(text, kind){ return '<div class="stamp ' + kind + '">' + text + '</div>'; }
  function receiptHTML(d){
    const t = now();
    return '<div class="receipt">proposed ' + t + ' · decided ' + t + ' · approved by you ' + t + ' · captured ' + t + ' · ref 6EJ8…</div>';
  }

  function makeCard(d){
    const el = document.createElement('article');
    el.className = 'card needs-you enter';
    el.innerHTML =
      '<div class="card-main">' +
        '<div class="card-left">' +
          '<div class="status-mark"><span class="dot"></span>Needs you</div>' +
          '<div class="seller">' + d.seller + '</div>' +
          '<div class="what">' + d.what + '</div>' +
          '<div class="why">why · ' + d.why + '</div>' +
        '</div>' +
        '<div class="amount">' + fmt(d.amount) + '</div>' +
      '</div>' +
      '<div class="card-actions">' +
        '<button class="btn primary" type="button" data-act="approve">Approve</button>' +
        '<button class="btn quiet" type="button" data-act="decline">Decline</button>' +
      '</div>' +
      '<div class="verdict" hidden></div>';
    el.querySelector('[data-act=approve]').addEventListener('click', () => decide(el, d, 'approve'));
    el.querySelector('[data-act=decline]').addEventListener('click', () => decide(el, d, 'decline'));
    return el;
  }

  function decide(el, d, act){
    if (el.dataset.decided) return;   // guard: one decision per card
    el.dataset.decided = '1';
    const actions = el.querySelector('.card-actions');
    const statusMark = el.querySelector('.status-mark');
    const verdict = el.querySelector('.verdict');
    actions.hidden = true;
    el.classList.remove('needs-you');

    if (act === 'approve'){
      statusMark.innerHTML = '<span class="dot ok"></span>Authorizing';
      setEngine('authorizing with PayPal…');
      const land = () => {
        el.classList.add('paid');
        statusMark.innerHTML = '<span class="dot ok"></span>Paid';
        verdict.hidden = false;
        verdict.innerHTML = stampHTML('PAID', 'allow') + receiptHTML(d);
        const fromNum = spent;
        spent += d.amount;
        setWall(spent / CAP);
        animateNumber(fromNum, spent);
        setEngine('captured · counted once');
        updateCount();
        setTimeout(appendNext, 1100);
      };
      if (reduce) land(); else setTimeout(land, 750);
    } else {
      el.classList.add('denied');
      statusMark.innerHTML = '<span class="dot no"></span>You said no';
      verdict.hidden = false;
      verdict.innerHTML = stampHTML('DENIED', 'deny') + '<div class="receipt">no money moved</div>';
      setEngine('declined · no money moved');
      updateCount();
      setTimeout(appendNext, 1100);
    }
  }

  function appendNext(){
    if (qi < queue.length){ gateList.appendChild(makeCard(queue[qi])); qi++; updateCount(); }
  }
  function init(){
    gateList.innerHTML = '';
    spent = 42; qi = 0;
    setWall(spent / CAP);
    spentNum.textContent = fmt(spent);
    setEngine('engine · rules owner-3 · checked fresh every time');
    appendNext();
  }

  document.getElementById('replay').addEventListener('click', init);
  init();
</script>
</body>
</html>
